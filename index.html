<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributed System Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #00ff00;
            overflow: hidden;
            height: 100vh;
        }

        .monitor-container {
            display: grid;
            grid-template-areas:
                "resources resources resources"
                "map map minimap"
                "build research controls";
            grid-template-columns: 1fr 1fr 300px;
            grid-template-rows: 50px 1fr 200px;
            height: calc(100vh - 44px);
            gap: 2px;
            background: #333;
        }

        .resource-panel {
            grid-area: resources;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 2px solid #444;
        }

        .resource-item {
            margin-right: 30px;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 3px;
            transition: background 0.2s;
        }

        .resource-item:hover {
            background: #444;
        }

        .main-map {
            grid-area: map;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
            position: relative;
            border: 2px solid #444;
            overflow: hidden;
            cursor: grab;
        }
        
        .main-map.dragging {
            cursor: grabbing;
        }

        .minimap {
            grid-area: minimap;
            background: #1a1a1a;
            border: 2px solid #444;
            position: relative;
        }

        .build-menu {
            grid-area: build;
            background: #2a2a2a;
            border: 2px solid #444;
            padding: 10px;
            overflow-y: auto;
        }

        .research-menu {
            grid-area: research;
            background: #2a2a2a;
            border: 2px solid #444;
            padding: 10px;
            overflow-y: auto;
        }

        .controls {
            grid-area: controls;
            background: #2a2a2a;
            border: 2px solid #444;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .menu-title {
            color: #00ccff;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-size: 14px;
        }

        .menu-button, .control-button {
            background: #1a1a1a;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 8px 16px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            text-transform: uppercase;
            transition: all 0.2s;
            margin-bottom: 5px;
            display: block;
            width: 100%;
        }

        .menu-button:hover, .control-button:hover {
            background: #00ff00;
            color: #1a1a1a;
            box-shadow: 0 0 10px #00ff00;
        }

        .control-button {
            background: #2a2a2a;
            border: 2px solid #00ccff;
            color: #00ccff;
        }

        .control-button:hover {
            background: #00ccff;
            color: #1a1a1a;
            box-shadow: 0 0 10px #00ccff;
        }

        .status-display {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0a0a0a;
            color: #00ff00;
            padding: 10px 20px;
            border-top: 2px solid #444;
            font-size: 14px;
            z-index: 1000;
        }

        /* SVG Styles */
        .map-svg, .minimap-svg {
            width: 100%;
            height: 100%;
        }

        /* Main map network styles */
        .map-svg .terrain {
            fill: url(#terrainGradient);
            stroke: none;
        }

        .map-svg .server-island {
            fill: url(#serverIslandGradient);
            stroke: #00ff00;
            stroke-width: 2;
            cursor: pointer;
        }

        .map-svg .server-island:hover {
            stroke: #00ff00;
            stroke-width: 3;
            filter: brightness(1.2);
        }

        .map-svg .process {
            cursor: pointer;
        }

        .map-svg .process rect:hover {
            filter: brightness(1.3);
            stroke-width: 3;
        }

        .map-svg .traffic-flow circle {
            filter: drop-shadow(0 0 3px #00ff00);
        }

        /* Minimap 2D styles (simpler, top-down) */
        .minimap-svg .terrain {
            fill: #2a4a2a;
            stroke: #1a3a1a;
            stroke-width: 1;
        }

        .minimap-svg .water {
            fill: #003366;
            stroke: #002244;
            stroke-width: 1;
        }

        .minimap-svg .mountain {
            fill: #4a4a4a;
            stroke: #333;
            stroke-width: 1;
        }

        .minimap-svg .building {
            fill: #8a6a3a;
            stroke: #6a4a2a;
            stroke-width: 1;
        }

        .minimap-svg .unit {
            fill: #ffff00;
            stroke: #cccc00;
            stroke-width: 1;
        }

        .minimap-svg .resource-node {
            fill: #0066ff;
            stroke: #0044cc;
            stroke-width: 1;
        }
        
        #viewport-rect {
            cursor: pointer;
        }
    </style>
</head>
<body>

                        <stop offset="50%" stop-color="#00cc00"/>

                        <text x="0" y="5" text-anchor="middle" fill="#fff" font-size="10">LLM-2</text>
                    </g>
                    
                    <!-- Processes on Server-Beta -->

                    </g>
                    <g class="process" transform="translate(2050,310)">

                        <text x="0" y="5" text-anchor="middle" fill="#fff" font-size="10">LLM-4</text>
                    </g>
                    
                    <!-- Processes on Server-Gamma -->
                    <g class="process" transform="translate(380,1480)">
                        <rect x="-20" y="-15" width="40" height="30" fill="url(#processGradient)" stroke="#0066cc" stroke-width="2" rx="3"/>
                        <text x="0" y="5" text-anchor="middle" fill="#fff" font-size="10">MCP-4</text>
                    </g>
                    <g class="process" transform="translate(450,1490)">
                        <rect x="-20" y="-15" width="40" height="30" fill="url(#activeProcessGradient)" stroke="#00cc00" stroke-width="2" rx="3"/>
                        <text x="0" y="5" text-anchor="middle" fill="#000" font-size="10">LLM-5</text>
                    </g>
                    
                    <!-- Processes on Server-Delta -->
                    <g class="process" transform="translate(1980,1480)">
                        <rect x="-20" y="-15" width="40" height="30" fill="url(#activeProcessGradient)" stroke="#00cc00" stroke-width="2" rx="3"/>
                        <text x="0" y="5" text-anchor="middle" fill="#000" font-size="10">LLM-6</text>
                    </g>
                    <g class="process" transform="translate(2050,1490)">
                        <rect x="-20" y="-15" width="40" height="30" fill="url(#processGradient)" stroke="#0066cc" stroke-width="2" rx="3"/>

                    </g>

                        <text x="0" y="5" text-anchor="middle" fill="#fff" font-size="10">LLM-7</text>
                    </g>

                        <rect x="-20" y="-15" width="40" height="30" fill="url(#activeProcessGradient)" stroke="#00cc00" stroke-width="2" rx="3"/>
                        <text x="0" y="5" text-anchor="middle" fill="#000" font-size="10">MCP-6</text>
                    </g>
                    <g class="process" transform="translate(240,890)">

                        <text x="0" y="5" text-anchor="middle" fill="#fff" font-size="10">LLM-8</text>
                    </g>

                        <text x="0" y="5" text-anchor="middle" fill="#fff" font-size="10">MCP-7</text>
                    </g>
                    
                    <!-- Network Traffic Indicators -->

                            <animateMotion dur="3s" repeatCount="indefinite">
                                <mpath href="#path-alpha-center"/>
                            </animateMotion>
                        </circle>
                        <circle r="3" fill="#00ff00" opacity="0.8">
                            <animateMotion dur="3s" repeatCount="indefinite" begin="1s">
                                <mpath href="#path-beta-center"/>
                            </animateMotion>
                        </circle>
                        <circle r="3" fill="#00ff00" opacity="0.8">
                            <animateMotion dur="3s" repeatCount="indefinite" begin="2s">
                                <mpath href="#path-gamma-center"/>
                            </animateMotion>
                        </circle>
                    </g>
                    
                    <!-- Define paths for traffic animation -->
                    <defs>
                        <path id="path-alpha-center" d="M 400,300 L 1200,900"/>
                        <path id="path-beta-center" d="M 2000,300 L 1200,900"/>
                        <path id="path-gamma-center" d="M 400,1500 L 1200,900"/>
                    </defs>
                </g>

    <script type="module">
        import init, { 
            handle_map_click, 
            handle_minimap_click, 
            handle_build_button, 
            handle_research_button, 
            handle_unit_command,
            handle_resource_click,
            log_status 
        } from './pkg/rts_monitor.js';

        // Map state management in JavaScript
        const mapState = {
            mapWidth: 2400,
            mapHeight: 1800,
            viewportWidth: 800,
            viewportHeight: 600,
            viewportX: 800, // Start centered
            viewportY: 600
        };

        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let viewportStart = { x: 0, y: 0 };
        let scrollInterval = null;
        let currentMousePos = { x: 0, y: 0 };

        function updateMapView() {
            const mapContent = document.getElementById('map-content');
            if (mapContent) {
                // Apply isometric transformation first, then viewport translation
                const viewportTransform = `translate(${-mapState.viewportX}, ${-mapState.viewportY})`;
                // Reduced rotation for better minimap alignment: less skew, more similar to top-down
                const isoTransform = 'matrix(1, 0.15, -0.3, 0.9, 200, 50)';
                mapContent.setAttribute('transform', `${viewportTransform} ${isoTransform}`);
            }
            updateMinimapViewport();
        }

        function updateMinimapViewport() {
            const viewportRect = document.getElementById('viewport-rect');
            if (viewportRect) {
                const scaleX = 200 / mapState.mapWidth;
                const scaleY = 150 / mapState.mapHeight;
                
                viewportRect.setAttribute('x', mapState.viewportX * scaleX);
                viewportRect.setAttribute('y', mapState.viewportY * scaleY);
                viewportRect.setAttribute('width', mapState.viewportWidth * scaleX);
                viewportRect.setAttribute('height', mapState.viewportHeight * scaleY);
            }
        }

        function clampViewport() {
            mapState.viewportX = Math.max(0, Math.min(mapState.viewportX, mapState.mapWidth - mapState.viewportWidth));
            mapState.viewportY = Math.max(0, Math.min(mapState.viewportY, mapState.mapHeight - mapState.viewportHeight));
        }

        function handleEdgeScroll() {
            const mapDiv = document.getElementById('main-map');
            const rect = mapDiv.getBoundingClientRect();
            const edgeThreshold = 50;
            const scrollSpeed = 20;
            
            let dx = 0;
            let dy = 0;
            
            if (currentMousePos.x < edgeThreshold) dx = -scrollSpeed;
            else if (currentMousePos.x > rect.width - edgeThreshold) dx = scrollSpeed;
            
            if (currentMousePos.y < edgeThreshold) dy = -scrollSpeed;
            else if (currentMousePos.y > rect.height - edgeThreshold) dy = scrollSpeed;
            
            if (dx !== 0 || dy !== 0) {
                mapState.viewportX += dx;
                mapState.viewportY += dy;
                clampViewport();
                updateMapView();
            }
        }

        async function run() {
            await init();
            
            // Override console.log to show status in UI
            const originalLog = console.log;
            console.log = function(message) {
                originalLog(message);
                const statusEl = document.getElementById('status');
                if (statusEl && typeof message === 'string' && message.includes('System Monitor:')) {
                    statusEl.textContent = message.replace('System Monitor: ', '');
                }
            };

            // Initialize map view
            updateMapView();
            log_status("Distributed System Monitor initialized - Network topology loaded");

            // Map interactions
            const mapSvg = document.getElementById('map-svg');
            const mapDiv = document.getElementById('main-map');
            
            // Map click handler with isometric coordinate conversion
            mapSvg.addEventListener('click', function(event) {
                if (!isDragging) {
                    const rect = mapSvg.getBoundingClientRect();
                    const screenX = event.clientX - rect.left;
                    const screenY = event.clientY - rect.top;
                    
                    // Convert screen coordinates to SVG coordinates
                    const svgX = (screenX / rect.width) * 800;
                    const svgY = (screenY / rect.height) * 600;
                    
                    // Reverse the isometric transformation matrix
                    // matrix(0.866, 0.5, -0.866, 0.5, 400, 100)
                    const adjustedX = svgX - 400;
                    const adjustedY = svgY - 100;
                    
                    // Apply inverse matrix transformation
                    const det = 0.866 * 0.5 - 0.5 * (-0.866); // determinant
                    const worldX = ((0.5 * adjustedX) - (-0.866 * adjustedY)) / det + mapState.viewportX;
                    const worldY = ((-0.5 * adjustedX) + (0.866 * adjustedY)) / det + mapState.viewportY;
                    
                    handle_map_click(worldX, worldY);
                }
            });

            // Mouse down for drag
            mapDiv.addEventListener('mousedown', function(event) {
                if (event.button === 0) { // Left mouse button
                    isDragging = true;
                    dragStart.x = event.clientX;
                    dragStart.y = event.clientY;
                    viewportStart.x = mapState.viewportX;
                    viewportStart.y = mapState.viewportY;
                    mapDiv.classList.add('dragging');
                    event.preventDefault();
                }
            });

            // Mouse move for drag and edge scroll with isometric adjustments
            document.addEventListener('mousemove', function(event) {
                const rect = mapDiv.getBoundingClientRect();
                const isOverMap = event.clientX >= rect.left && event.clientX <= rect.right &&
                                 event.clientY >= rect.top && event.clientY <= rect.bottom;
                
                if (isOverMap) {
                    currentMousePos.x = event.clientX - rect.left;
                    currentMousePos.y = event.clientY - rect.top;
                    
                    if (isDragging && event.buttons === 1) {
                        // Direct 1:1 movement without scaling compensation
                        const screenDx = dragStart.x - event.clientX;
                        const screenDy = dragStart.y - event.clientY;
                        
                        mapState.viewportX = viewportStart.x + screenDx;
                        mapState.viewportY = viewportStart.y + screenDy;
                        clampViewport();
                        updateMapView();
                    } else if (!isDragging && !scrollInterval) {
                        scrollInterval = setInterval(handleEdgeScroll, 16);
                    }
                } else if (scrollInterval) {
                    clearInterval(scrollInterval);
                    scrollInterval = null;
                }
            });

            // Mouse up to stop drag
            document.addEventListener('mouseup', function(event) {
                if (event.button === 0) {
                    isDragging = false;
                    mapDiv.classList.remove('dragging');
                }
            });

            // Minimap click handler
            const minimapSvg = document.querySelector('.minimap-svg');
            minimapSvg.addEventListener('click', function(event) {
                const pt = minimapSvg.createSVGPoint();
                pt.x = event.clientX;
                pt.y = event.clientY;
                const svgP = pt.matrixTransform(minimapSvg.getScreenCTM().inverse());
                
                // Convert minimap coordinates to world coordinates
                const scaleX = mapState.mapWidth / 200;
                const scaleY = mapState.mapHeight / 150;
                
                // Center viewport on clicked position
                mapState.viewportX = (svgP.x * scaleX) - (mapState.viewportWidth / 2);
                mapState.viewportY = (svgP.y * scaleY) - (mapState.viewportHeight / 2);
                clampViewport();
                updateMapView();
                
                handle_minimap_click(svgP.x, svgP.y);
            });

            // Keyboard controls with isometric adjustments
            document.addEventListener('keydown', function(event) {
                const step = 40;
                let moved = false;
                
                switch(event.key) {
                    case 'ArrowUp':
                    case 'w':
                    case 'W':
                        mapState.viewportY -= step;
                        moved = true;
                        break;
                    case 'ArrowDown':
                    case 's':
                    case 'S':
                        mapState.viewportY += step;
                        moved = true;
                        break;
                    case 'ArrowLeft':
                    case 'a':
                    case 'A':
                        mapState.viewportX -= step;
                        moved = true;
                        break;
                    case 'ArrowRight':
                    case 'd':
                    case 'D':
                        mapState.viewportX += step;
                        moved = true;
                        break;
                }
                
                if (moved) {
                    event.preventDefault();
                    clampViewport();
                    updateMapView();
                    log_status(`Viewport moved to (${Math.round(mapState.viewportX)}, ${Math.round(mapState.viewportY)})`);
                }
            });

            // Make WASM functions globally available
            window.handleBuildButton = handle_build_button;
            window.handleResearchButton = handle_research_button;
            window.handleUnitCommand = handle_unit_command;
            window.handleResourceClick = handle_resource_click;
        }

        run();
    </script>
</body>
</html>
